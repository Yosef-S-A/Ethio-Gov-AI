services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

volumes:
  db-data:
